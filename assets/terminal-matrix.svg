<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Zakarya Oukil animated terminal header</title>
  <desc id="desc">An animated green terminal scene with ASCII rain, profile details, and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#020807"/><stop offset="1" stop-color="#061512"/></linearGradient>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#00f5b8" stop-opacity=".65"/><stop offset="1" stop-color="#00f5b8" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00f5b8" stroke-opacity=".055"/></pattern>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .rain { fill: url(#fade); font: 13px 'Courier New', monospace; animation: rain 7s linear infinite; }
      .rain2 { fill: url(#fade); font: 11px 'Courier New', monospace; animation: rain 10s linear infinite reverse; }
      .blink { animation: blink 1s steps(1,end) infinite; }
      .scan { animation: scan 4.5s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rain { from { transform: translateY(-145px); } to { transform: translateY(390px); } }
      @keyframes scan { from { transform: translateY(-25px); } to { transform: translateY(345px); } }
    </style>
  </defs>
  <rect width="1200" height="330" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#grid)"/>
  <g opacity=".28">
    <text class="rain" x="40" y="0">01001101 1010 001 1 0 1101 010 10110 001 101</text>
    <text class="rain2" x="120" y="-80">$ ./build --secure --verbose</text>
    <text class="rain" x="235" y="-50">01101000 00101011 110 001 0101 00110</text>
    <text class="rain2" x="375" y="-120">{ code: learn: ship: repeat: }</text>
    <text class="rain" x="540" y="-35">101 0011 01001 110 0001 10100 010</text>
    <text class="rain2" x="710" y="-95">[ system online ] [ system online ]</text>
    <text class="rain" x="885" y="-70">0110 1010 10101 000 110 01101 01</text>
    <text class="rain2" x="1025" y="-120">root@github:~#</text>
  </g>
  <rect x="18" y="18" width="1164" height="294" rx="8" fill="#020a08" fill-opacity=".87" stroke="#00f5b8" stroke-opacity=".42"/>
  <circle cx="42" cy="42" r="5" fill="#ff5f57"/><circle cx="60" cy="42" r="5" fill="#febc2e"/><circle cx="78" cy="42" r="5" fill="#28c840"/>
  <text x="100" y="47" fill="#7ee8ce" font-size="13" class="mono">zakarya@github — terminal — 120x24</text>
  <rect class="scan" x="19" y="0" width="1162" height="2" fill="#00f5b8" opacity=".18"/>
  <g class="mono">
    <text x="46" y="92" fill="#00f5b8" font-size="16">zakarya@github:~$ whoami</text>
    <text x="46" y="126" fill="#e5fff7" font-size="29" font-weight="bold" filter="url(#glow)">ZAKARYA OUKIL</text>
    <text x="46" y="154" fill="#84cdbb" font-size="15">full-stack developer // cybersecurity master's student</text>
    <text x="46" y="181" fill="#00f5b8" font-size="16">zakarya@github:~$ cat status.log</text>
    <text x="46" y="209" fill="#c3f7e9" font-size="15">[+] final-year student @ HIS University</text>
    <text x="46" y="234" fill="#c3f7e9" font-size="15">[+] building software · learning security · exploring AI</text>
    <text x="46" y="269" fill="#00f5b8" font-size="16">zakarya@github:~$ <tspan class="blink">█</tspan></text>
  </g>
  <text x="1018" y="286" fill="#00f5b8" opacity=".75" class="mono" font-size="12">STATUS: ONLINE</text>
</svg>
